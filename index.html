<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音乐与声学工程课程评价 | Politecnico di Milano</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="title-copy">
          <p class="eyebrow">Politecnico di Milano · Music and Acoustic Engineering</p>
          <h1>音乐与声学工程课程评价</h1>
          <p class="header-subtitle">米兰理工大学音乐与声学工程专业课程评价</p>
        </div>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="筛选和排序">
        <label class="search-box">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="课程名、代码、老师或关键词" />
        </label>

        <label>
          <span>排序</span>
          <select id="sortSelect">
            <option value="overall-desc">总评分从高到低</option>
            <option value="overall-asc">总评分从低到高</option>
            <option value="updated-desc" selected>最近更新</option>
          </select>
        </label>
      </section>

      <section class="page-section" aria-labelledby="recentTitle">
        <div class="section-heading">
          <h2 id="recentTitle">最近更新</h2>
        </div>
        <div id="recentGrid" class="recent-grid" aria-live="polite"></div>
      </section>

      <section class="page-section" aria-labelledby="groupsTitle">
        <div class="section-heading">
          <h2 id="groupsTitle">按课程分类</h2>
          <label class="section-sort">
            <span>课程排序</span>
            <select id="courseSortSelect" class="compact-select">
              <option value="name-asc">按名字排序</option>
              <option value="code-asc">按课程号排序</option>
              <option value="score-desc">按课程总得分排序</option>
              <option value="count-desc">按评价数量排序</option>
            </select>
          </label>
        </div>
        <div id="courseGroups" class="course-groups" aria-live="polite"></div>
      </section>

      <p id="emptyState" class="empty-state" hidden>没有找到匹配的课程评价。</p>
    </main>

    <template id="courseCardTemplate">
      <article class="course-card">
        <div class="card-head">
          <div>
            <p class="course-meta"></p>
            <h2></h2>
          </div>
          <div class="overall-score" aria-label="总评分">
            <strong></strong>
            <span>总评分</span>
          </div>
        </div>

        <dl class="info-row">
          <div>
            <dt>授课老师</dt>
            <dd class="teacher"></dd>
          </div>
          <div>
            <dt>评价者</dt>
            <dd class="author"></dd>
          </div>
          <div>
            <dt>学期</dt>
            <dd class="semester"></dd>
          </div>
        </dl>

        <div class="review-sections">
          <section>
            <div class="section-title">
              <h3>课程内容</h3>
              <span class="score content-score"></span>
            </div>
            <p class="content-review"></p>
          </section>

          <section>
            <div class="section-title">
              <h3>考试考核</h3>
              <span class="score assessment-score"></span>
            </div>
            <p class="assessment-review"></p>
          </section>

          <section>
            <div class="section-title">
              <h3>老师评价</h3>
              <span class="score teacher-score"></span>
            </div>
            <p class="teacher-review"></p>
          </section>

          <section class="notes-section">
            <div class="section-title">
              <h3>其它/备注</h3>
            </div>
            <p class="notes-review"></p>
          </section>
        </div>

        <footer class="card-foot">
          <span class="updated-at"></span>
        </footer>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
