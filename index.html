<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>专业课程评价</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">Course Review Index</p>
          <h1>专业课程评价</h1>
        </div>
        <div class="stats" aria-label="课程评价统计">
          <div>
            <strong id="courseCount">0</strong>
            <span>门课程</span>
          </div>
          <div>
            <strong id="averageScore">0.0</strong>
            <span>平均总评分</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="筛选和排序">
        <label class="search-box">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="课程名、代码、老师或关键词" />
        </label>

        <label>
          <span>类别</span>
          <select id="categoryFilter">
            <option value="all">全部类别</option>
          </select>
        </label>

        <label>
          <span>排序</span>
          <select id="sortSelect">
            <option value="overall-desc">总评分从高到低</option>
            <option value="overall-asc">总评分从低到高</option>
            <option value="name-asc">课程名 A-Z</option>
            <option value="updated-desc">最近更新</option>
          </select>
        </label>
      </section>

      <section id="courseGrid" class="course-grid" aria-live="polite"></section>
      <p id="emptyState" class="empty-state" hidden>没有找到匹配的课程评价。</p>
    </main>

    <template id="courseCardTemplate">
      <article class="course-card">
        <div class="card-head">
          <div>
            <p class="course-meta"></p>
            <h2></h2>
          </div>
          <div class="overall-score" aria-label="总评分">
            <strong></strong>
            <span>总评分</span>
          </div>
        </div>

        <dl class="info-row">
          <div>
            <dt>授课老师</dt>
            <dd class="teacher"></dd>
          </div>
          <div>
            <dt>学期</dt>
            <dd class="semester"></dd>
          </div>
          <div>
            <dt>类别</dt>
            <dd class="category"></dd>
          </div>
        </dl>

        <div class="review-sections">
          <section>
            <div class="section-title">
              <h3>课程内容</h3>
              <span class="score content-score"></span>
            </div>
            <p class="content-review"></p>
          </section>

          <section>
            <div class="section-title">
              <h3>考试考核</h3>
              <span class="score assessment-score"></span>
            </div>
            <p class="assessment-review"></p>
          </section>

          <section>
            <div class="section-title">
              <h3>老师评价</h3>
              <span class="score teacher-score"></span>
            </div>
            <p class="teacher-review"></p>
          </section>
        </div>

        <footer class="card-foot">
          <span class="updated-at"></span>
        </footer>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
